name: Migrate catalyst project into Copyright

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror catalyst history into Copyright main
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/stloendays/Catalyst-Longevity-Benchmark.git /tmp/source.git
          cd /tmp/source.git
          git push --force \
            https://x-access-token:${GITHUB_TOKEN}@github.com/stloendays/Copyright.git \
            refs/heads/archive/catalyst-main-before-split-20260913:refs/heads/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
